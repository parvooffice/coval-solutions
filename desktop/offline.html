<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>COVAL</title>
  <style>
    body { display: grid; place-items: center; min-height: 100vh; margin: 0; background: #09090b; color: #fafafa; font: 15px/1.6 "Segoe UI", sans-serif; text-align: center; }
    p { max-width: 420px; color: #a1a1aa; }
    button { min-height: 38px; padding: 0 18px; border: 0; border-radius: 9px; background: #fafafa; color: #09090b; font-weight: 650; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>Your COVAL dashboard needs the internet. You can still score a folder on this computer from the COVAL icon in the system tray.</p>
    <button type="button" id="retry">Try again</button>
  </main>
  <script>
    const retry = new URLSearchParams(location.search).get("retry");
    const button = document.getElementById("retry");
    button.onclick = () => { if (retry && retry.startsWith("https://")) location.href = retry; };
    window.addEventListener("online", () => button.click());
  </script>
</body>
</html>
