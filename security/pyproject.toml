[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-security-auditor"
version = "0.1.0"
description = "Terminal-operated autonomous repository security auditing system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "typer>=0.12.0",
  "rich>=13.0.0",
  "GitPython>=3.1.0",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "pydantic>=2.8.0",
]

[project.scripts]
repo-security-auditor = "repo_security_auditor.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
